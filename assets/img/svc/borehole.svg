<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-label="Illustrated drilling derrick, storage tank and pump house above the water table">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#101318"/><stop offset="1" stop-color="#191C21"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="99%" r="70%">
    <stop offset="0" stop-color="#B09020" stop-opacity=".30"/>
    <stop offset="1" stop-color="#B09020" stop-opacity="0"/>
  </radialGradient>
  <style>
    .si-h{fill:none;stroke:rgba(247,244,239,.30);stroke-width:2}
    .si-l{fill:none;stroke:rgba(247,244,239,.28);stroke-width:1.6;stroke-linecap:round}
    .si-f{fill:rgba(247,244,239,.05);stroke:rgba(247,244,239,.22);stroke-width:1.5}
    .si-g{fill:none;stroke:#C8AA45;stroke-width:2;stroke-linecap:round}
    .si-gf{fill:rgba(217,192,112,.50)}
    .si-lead{fill:rgba(176,144,32,.20);stroke:#C8AA45;stroke-width:1.6}
    .si-mark{fill:#C8AA45}
    .si-ring{fill:none;stroke:rgba(247,244,239,.30);stroke-width:1.6}
    .si-key{fill:none;stroke:#C8AA45;stroke-width:2;stroke-linecap:round}
    .si-bench{fill:rgba(176,144,32,.09)}
    .si-sub{fill:none;stroke:rgba(247,244,239,.16);stroke-width:1.5;stroke-dasharray:8 11}
  </style>
</defs>

<rect width="1280" height="540" fill="url(#sky)"/>
<rect width="1280" height="540" fill="url(#glow)"/>
<!-- elevated storage tank -->
<rect class="si-f" x="140" y="318" width="150" height="86" rx="4"/>
<path class="si-l" d="M154 404v66M276 404v66M154 404l122 66M276 404l-122 66M140 342h150"/>

<!-- derrick -->
<path class="si-l" d="M556 470 640 128 724 470M604 214h72M586 300h108M568 386h136"/>
<rect class="si-f" x="512" y="422" width="256" height="48" rx="4"/>
<rect class="si-lead" x="616" y="104" width="48" height="26" rx="4"/>

<!-- pump house -->
<rect class="si-f" x="980" y="366" width="160" height="104" rx="4"/>
<path class="si-l" d="M980 366 1060 320 1140 366M1040 414h44v56h-44z"/>

<path class="si-h" d="M0 470h1280"/>

<!-- strata, broken where the shaft passes through -->
<path class="si-sub" d="M0 498h598M682 498h598M0 520h578M702 520h578"/>
<path class="si-g" d="M640 128V536"/>

<!-- water found -->
<path class="si-gf" d="M960 482c11 14 17 22 17 29a17 17 0 0 1-34 0c0-7 6-15 17-29Z"/>
<path class="si-l" d="M250 482c11 14 17 22 17 29a17 17 0 0 1-34 0c0-7 6-15 17-29Z"/>
<path class="si-l" d="M420 494c8 10 13 17 13 22a13 13 0 0 1-26 0c0-5 5-12 13-22Z"/>
</svg>