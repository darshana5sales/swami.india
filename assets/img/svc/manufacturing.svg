<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-label="Illustrated paving block press with stacked interlocking tiles and a curing yard">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#101318"/><stop offset="1" stop-color="#191C21"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="99%" r="70%">
    <stop offset="0" stop-color="#B09020" stop-opacity=".30"/>
    <stop offset="1" stop-color="#B09020" stop-opacity="0"/>
  </radialGradient>
  <style>
    .si-h{fill:none;stroke:rgba(247,244,239,.30);stroke-width:2}
    .si-l{fill:none;stroke:rgba(247,244,239,.28);stroke-width:1.6;stroke-linecap:round}
    .si-f{fill:rgba(247,244,239,.05);stroke:rgba(247,244,239,.22);stroke-width:1.5}
    .si-g{fill:none;stroke:#C8AA45;stroke-width:2;stroke-linecap:round}
    .si-gf{fill:rgba(217,192,112,.50)}
    .si-lead{fill:rgba(176,144,32,.20);stroke:#C8AA45;stroke-width:1.6}
  </style>
</defs>

<rect width="1280" height="540" fill="url(#sky)"/>
<rect width="1280" height="540" fill="url(#glow)"/>

<!-- the press: hopper, ram and mould box -->
<path class="si-l" d="M150 150h180l-30 74H180Z"/>
<rect class="si-f" x="176" y="224" width="128" height="60" rx="3"/>
<path class="si-g" d="M240 284v46"/>
<rect class="si-lead" x="184" y="330" width="112" height="42" rx="3"/>
<rect class="si-f" x="150" y="372" width="180" height="98" rx="3"/>
<path class="si-l" d="M150 420h180M196 372v98M284 372v98"/>

<!-- discharge conveyor -->
<path class="si-l" d="M330 396h250v34H330Z"/>
<path class="si-l" d="M356 430v40M420 430v40M484 430v40M548 430v40"/>
<circle class="si-l" cx="346" cy="413" r="11"/>
<circle class="si-l" cx="564" cy="413" r="11"/>

<!-- curing yard: interlocking tiles, laid in courses -->
<g class="si-f">
  <rect x="640" y="392" width="70" height="38" rx="2"/>
  <rect x="716" y="392" width="70" height="38" rx="2"/>
  <rect x="792" y="392" width="70" height="38" rx="2"/>
  <rect x="678" y="348" width="70" height="38" rx="2"/>
  <rect x="754" y="348" width="70" height="38" rx="2"/>
  <rect x="716" y="304" width="70" height="38" rx="2"/>
</g>
<g class="si-gf">
  <rect x="716" y="392" width="70" height="38" rx="2"/>
  <rect x="754" y="348" width="70" height="38" rx="2"/>
</g>
<path class="si-l" d="M640 430h222"/>

<!-- finished pallets, banded and ready -->
<g class="si-f">
  <rect x="940" y="376" width="130" height="94" rx="2"/>
  <rect x="1096" y="404" width="112" height="66" rx="2"/>
</g>
<path class="si-l" d="M940 408h130M940 440h130M1005 376v94M1096 436h112M1152 404v66"/>
<path class="si-g" d="M940 376h130M1096 404h112"/>

<path class="si-h" d="M0 470h1280"/>
</svg>
